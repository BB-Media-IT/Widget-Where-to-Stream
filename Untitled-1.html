<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widget where to stream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="/assets/style.css" rel="stylesheet">
    <style>
      /* Default Dark Theme */
      #WhereToStream {
        background-color: #282A34;
        color: #F2F2F2;
        padding: 10px;
        border-radius: 5px;
      }

      /* Light Theme */
      .light-theme {
        background-color: #F2F2F2 !important;
        color: #282A34 !important;
        border: 1px solid #ccc !important;
      }

      .light-theme h2 {
        color: #BA1E47 !important;
      }

      .switch-container {
        display: flex;
        justify-content: flex-end;
        margin: 10px 0;
      }

      .form-check-input {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <!-- Switch Button -->
        <div class="switch-container">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="themeSwitch" v-model="isLightTheme">
            <label class="form-check-label" for="themeSwitch">Light Theme</label>
          </div>
        </div>

        <!-- WhereToStream Container -->
        <div id="WhereToStream" :class="{ 'light-theme': isLightTheme }">
          <h2>Where To Stream</h2>
          <p>Content will appear here...</p>
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const isLightTheme = ref(false);

          return {
            isLightTheme
          };
        }
      }).mount('#app');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
